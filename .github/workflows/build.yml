name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Hue Hive rules, AI and server
        working-directory: huehive/web
        run: npm test

      - name: Test game logic and build APKs
        run: ./gradlew :core:test :app:assembleDebug :huehive:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: lances-of-the-realm-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hue-hive-debug-apk
          path: huehive/android/build/outputs/apk/debug/*.apk
